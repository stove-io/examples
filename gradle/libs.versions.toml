[versions]
stove = "1.0.0.565-SNAPSHOT"
kotlin = "2.4.21"
kotlinx = "1.11.0"
spring-boot = "3.5.16"
spring-kafka = "3.3.16"
arrow = "2.3.0"
kotest = "6.2.6"
ktor = "3.6.1"
testcontainers = "2.0.5"
grpc = "1.85.1"
grpc-kotlin = "1.5.0"
protobuf = "4.36.2"
protobuf-plugin = "0.10.0"
opentelemetry = "1.67.0"
opentelemetry-instrumentation = "2.33.1"
kotlin-logging = "8.0.4"
db-scheduler = "16.12.0"
postgresql = "42.7.14"
postgresql-r2dbc = "1.1.3.RELEASE"
r2dbc-pool = "1.0.2.RELEASE"

[libraries]
stove-bom = { module = "com.trendyol:stove-bom", version.ref = "stove" }
stove = { module = "com.trendyol:stove", version.ref = "stove" }
stove-process = { module = "com.trendyol:stove-process", version.ref = "stove" }
stove-container = { module = "com.trendyol:stove-container", version.ref = "stove" }
stove-postgres = { module = "com.trendyol:stove-postgres", version.ref = "stove" }
stove-http = { module = "com.trendyol:stove-http", version.ref = "stove" }
stove-tracing = { module = "com.trendyol:stove-tracing", version.ref = "stove" }
stove-dashboard = { module = "com.trendyol:stove-dashboard", version.ref = "stove" }
stove-kafka = { module = "com.trendyol:stove-kafka", version.ref = "stove" }
stove-spring = { module = "com.trendyol:stove-spring", version.ref = "stove" }
stove-wiremock = { module = "com.trendyol:stove-wiremock", version.ref = "stove" }
stove-grpc = { module = "com.trendyol:stove-grpc", version.ref = "stove" }
stove-grpc-mock = { module = "com.trendyol:stove-grpc-mock", version.ref = "stove" }
stove-extensions-kotest = { module = "com.trendyol:stove-extensions-kotest", version.ref = "stove" }

kotlinx-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx" }
kotlinx-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlinx" }
kotlinx-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "kotlinx" }
kotlinx-jdk8 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref = "kotlinx" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }

spring-boot-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc", version.ref = "spring-boot" }
spring-boot-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "spring-boot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka", version.ref = "spring-kafka" }
db-scheduler = { module = "com.github.kagkarlsson:db-scheduler-spring-boot-starter", version.ref = "db-scheduler" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
postgresql-r2dbc = { module = "org.postgresql:r2dbc-postgresql", version.ref = "postgresql-r2dbc" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "r2dbc-pool" }

grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-netty = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpc-kotlin" }
grpc-protoc-gen-java = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
grpc-protoc-gen-kotlin = { module = "io.grpc:protoc-gen-grpc-kotlin", version.ref = "grpc-kotlin" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }

opentelemetry-extension-kotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin", version.ref = "opentelemetry" }
opentelemetry-instrumentation-annotations = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations", version.ref = "opentelemetry-instrumentation" }

ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson", version.ref = "ktor" }

kotest-runner-junit6 = { module = "io.kotest:kotest-runner-junit6", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
stove-tracing = { id = "com.trendyol.stove.tracing", version.ref = "stove" }
